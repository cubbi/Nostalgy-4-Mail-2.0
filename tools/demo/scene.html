<!doctype html>
<!--
  The animated demo on the website: a simplified Mail window with made-up messages
  and the Nostalgy-4-Mail picker. render(t) draws the state at t seconds; render.swift
  turns it into demo-light.gif and demo-dark.gif for the website (docs branch).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --page: #f7f7f8; --win: #ffffff; --bar: #f3f3f4; --side: #ececef; --line: rgba(0,0,0,0.09);
    --text: #1d1d1f; --muted: #6e6e73; --faint: #a1a1a6; --accent: #0a64d8; --accent-text: #fff;
    --sel-side: rgba(0,0,0,0.09); --panel: #ffffff; --field: #ffffff; --ring: rgba(10,100,216,0.45);
    --shadow: 0 0 0 0.5px rgba(0,0,0,0.14), 0 8px 24px rgba(0,0,0,0.16);
    --key-bg: rgba(29,29,31,0.88); --key-text: #fff; --pulse: rgba(10,100,216,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #161618; --win: #1e1e20; --bar: #2a2a2d; --side: #252528; --line: rgba(255,255,255,0.09);
      --text: #f2f2f4; --muted: #a1a1a6; --faint: #6e6e73; --accent: #0a64d8; --accent-text: #fff;
      --sel-side: rgba(255,255,255,0.1); --panel: #2b2b2e; --field: #1e1e20; --ring: rgba(60,140,255,0.55);
      --shadow: 0 0 0 0.5px rgba(255,255,255,0.14), 0 8px 24px rgba(0,0,0,0.6);
      --key-bg: rgba(242,242,244,0.92); --key-text: #1d1d1f; --pulse: rgba(60,140,255,0.28);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 680px; height: 430px; overflow: hidden; background: var(--page); }
  body { font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }

  .win { position: absolute; left: 20px; top: 15px; width: 640px; height: 400px; border-radius: 11px; overflow: hidden;
         background: var(--win); box-shadow: var(--shadow); display: grid; grid-template-columns: 150px 220px 1fr; }
  .side { background: var(--side); padding: 40px 8px 0; border-right: 1px solid var(--line); }
  .lights { position: absolute; left: 14px; top: 14px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .group { font-size: 10.5px; font-weight: 700; color: var(--faint); padding: 10px 8px 3px; }
  .box { display: flex; align-items: center; gap: 7px; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
  .box svg { width: 14px; height: 14px; flex: none; color: var(--accent); }
  .box .count { margin-left: auto; font-size: 11px; color: var(--muted); }
  .box.current { background: var(--sel-side); font-weight: 600; }
  .box.sub { padding-left: 26px; }

  .list { border-right: 1px solid var(--line); overflow: hidden; position: relative; }
  .listhead { height: 52px; padding: 13px 14px 0; border-bottom: 1px solid var(--line); background: var(--win); }
  .listhead b { font-size: 14px; display: block; }
  .listhead span { font-size: 10.5px; color: var(--muted); }
  .rows { position: relative; }
  .row { height: 58px; padding: 7px 12px 0 20px; border-bottom: 1px solid var(--line); overflow: hidden; position: relative; }
  .row.sel { background: var(--accent); color: var(--accent-text); border-radius: 7px; margin: 0 5px; padding-left: 15px; border-bottom-color: transparent; }
  .row .top { display: flex; justify-content: space-between; }
  .row .from { font-weight: 700; font-size: 12px; }
  .row .date { font-size: 10.5px; color: var(--muted); }
  .row .subj { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .prev { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.sel .date, .row.sel .prev { color: rgba(255,255,255,0.8); }
  .row .dot { position: absolute; left: 7px; top: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .row.sel .dot { display: none; }

  .read { padding: 52px 22px 0; position: relative; }
  .read .bar { position: absolute; left: 0; right: 0; top: 0; height: 52px; border-bottom: 1px solid var(--line); background: var(--win); }
  .read h2 { font-size: 15px; font-weight: 700; margin-top: 16px; }
  .read .who { display: flex; gap: 9px; align-items: center; margin-top: 10px; }
  .read .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--faint); color: #fff; font-weight: 700; font-size: 12px; display: grid; place-items: center; }
  .read .who b { font-size: 12px; display: block; } .read .who span { font-size: 10.5px; color: var(--muted); }
  .read p { margin-top: 14px; font-size: 12px; line-height: 1.55; color: var(--text); }

  .picker { position: absolute; left: 150px; top: 95px; width: 380px; height: 222px; border-radius: 12px; background: var(--panel);
            box-shadow: var(--shadow); padding: 11px 13px; transform-origin: 50% 40%; }
  .picker .title { font-size: 10.5px; font-weight: 700; color: var(--muted); }
  .picker .field { margin-top: 7px; height: 28px; border-radius: 8px; background: var(--field); border: 1px solid var(--line);
                   box-shadow: 0 0 0 3px var(--ring); display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 13.5px; }
  .picker .field svg { width: 13px; height: 13px; color: var(--muted); flex: none; }
  .picker .field .ph { color: var(--faint); }
  .picker .caret { display: inline-block; width: 1.5px; height: 16px; background: var(--accent); margin-left: 1px; vertical-align: -3px; }
  .picker ul { list-style: none; margin-top: 9px; }
  .picker li { height: 24px; line-height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12.5px; white-space: nowrap; }
  .picker li.hl { background: var(--accent); color: var(--accent-text); }

  .key { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); padding: 9px 18px; border-radius: 12px;
         background: var(--key-bg); color: var(--key-text); font-size: 22px; font-weight: 600; letter-spacing: 0.02em;
         box-shadow: 0 8px 24px rgba(0,0,0,0.22); white-space: nowrap; }
  .fade { position: absolute; inset: 0; background: var(--page); pointer-events: none; }
</style>
</head>
<body>
<div class="win">
  <div class="lights"><i></i><i></i><i></i></div>
  <aside class="side" id="side"></aside>
  <div class="list">
    <div class="listhead"><b>Inbox</b><span id="count"></span></div>
    <div class="rows" id="rows"></div>
  </div>
  <div class="read"><div class="bar"></div><div id="read"></div></div>
</div>
<div class="picker" id="picker"></div>
<div class="key" id="key"></div>
<div class="fade" id="fade"></div>

<script>
const ICON = {
  inbox: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 9.5V13h12V9.5M2 9.5 4 3h8l2 6.5M2 9.5h3.5l1 1.5h3l1-1.5H14"/></svg>',
  folder: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.8 4.2h4.4l1.4 1.5h6.6v7.1H1.8z"/></svg>',
  sent: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 8 14 2.5 10.5 14 8 9z"/></svg>',
  search: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="6.8" cy="6.8" r="4.6"/><path d="m10.3 10.3 3.6 3.6"/></svg>',
};

const MESSAGES = [
  { from: "Lisa Chen", date: "9:41", subj: "Lunch on Friday?", prev: "There's a new place near the office…", unread: true,
    body: "There's a new place near the office that does great noodles. Friday at 12:30?" },
  { from: "Acme Corp", date: "9:12", subj: "Invoice #2024-118", prev: "Please find attached the invoice for…",
    body: "Please find attached the invoice for October. Payment is due within 30 days." },
  { from: "Acme Corp", date: "Yesterday", subj: "Order confirmation 5521", prev: "Thanks for your order. It will ship…",
    body: "Thanks for your order. It will ship on Monday and arrive within three days." },
  { from: "Tom Becker", date: "Yesterday", subj: "Slides for Monday", prev: "Here's the latest version of the deck…", unread: true,
    body: "Here's the latest version of the deck. I moved the roadmap to the end." },
  { from: "Globex", date: "Tuesday", subj: "Contract renewal", prev: "Your contract renews on the 1st of…",
    body: "Your contract renews on the 1st of next month. No action is needed." },
  { from: "Design Weekly", date: "Monday", subj: "This week in design", prev: "Ten type specimens worth a look…",
    body: "Ten type specimens worth a look, and an interview with a lettering artist." },
];

const FOLDERS = ["Work / Clients / Globex", "iCloud / Archive", "Work / Invoices", "iCloud / Receipts",
                 "Work / Clients / Acme", "iCloud / Travel", "Work / Projects / Apollo", "iCloud / Archive / 2025",
                 "Work / Clients / Acme / Orders"];

// Timeline in seconds.
const T = {
  key1: [1.1, 2.0],  picker: [1.4, 3.45], type: [2.05, 2.3, 2.55], ret: [3.25, 3.9],
  move1: 3.45, key2: [5.0, 5.9], move2: 5.3, collapse: 0.28, pulse: 0.8, fadeOut: [7.5, 8.0], fadeIn: [0, 0.35],
  length: 8.0,
};

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const within = (t, [a, b]) => t >= a && t < b;

function render(t) {
  // Which messages are gone, and how far the one being moved has collapsed.
  const gone = [], collapsing = {};
  for (const [at, index] of [[T.move1, 1], [T.move2, 2]]) {
    const p = (t - at) / T.collapse;
    if (p >= 1) gone.push(index); else if (p >= 0) collapsing[index] = ease(p);
  }
  const visible = MESSAGES.map((m, i) => i).filter(i => !gone.includes(i));
  // Selection: the moved message stays selected while it collapses, then the next one.
  let selected = 1;
  if (t >= T.move1 + T.collapse) selected = 2;
  if (t >= T.move2 + T.collapse) selected = 3;

  // Sidebar, with the Acme folder lit up briefly as messages arrive.
  let pulse = 0;
  for (const at of [T.move1, T.move2]) { const p = (t - at) / T.pulse; if (p >= 0 && p < 1) pulse = Math.sin(Math.PI * p); }
  const unread = visible.filter(i => MESSAGES[i].unread).length;
  document.getElementById("side").innerHTML = `
    <div class="group">Favourites</div>
    <div class="box current">${ICON.inbox}Inbox<span class="count">${unread}</span></div>
    <div class="box">${ICON.sent}Sent</div>
    <div class="group">iCloud</div>
    <div class="box">${ICON.folder}Archive</div>
    <div class="box">${ICON.folder}Receipts</div>
    <div class="box">${ICON.folder}Travel</div>
    <div class="group">Work</div>
    <div class="box">${ICON.folder}Clients</div>
    <div class="box sub" style="background: rgba(10,100,216,${(0.22 * pulse).toFixed(3)})">${ICON.folder}Acme</div>
    <div class="box sub">${ICON.folder}Globex</div>
    <div class="box">${ICON.folder}Invoices</div>`;

  document.getElementById("count").textContent = `${visible.length} messages, ${unread} unread`;
  document.getElementById("rows").innerHTML = visible.map(i => {
    const m = MESSAGES[i], c = collapsing[i];
    const style = c !== undefined ? `style="height:${(58 * (1 - c)).toFixed(1)}px;opacity:${(1 - c).toFixed(2)}"` : "";
    return `<div class="row${i === selected ? " sel" : ""}" ${style}>
      ${m.unread ? '<span class="dot"></span>' : ""}
      <div class="top"><span class="from">${m.from}</span><span class="date">${m.date}</span></div>
      <div class="subj">${m.subj}</div><div class="prev">${m.prev}</div></div>`;
  }).join("");

  const m = MESSAGES[selected];
  document.getElementById("read").innerHTML = `
    <h2>${m.subj}</h2>
    <div class="who"><div class="avatar">${m.from[0]}</div><div><b>${m.from}</b><span>To: me · ${m.date}</span></div></div>
    <p>${m.body}</p>`;

  // Picker: pops in, filters as letters are typed, disappears on Return.
  const picker = document.getElementById("picker");
  if (within(t, T.picker)) {
    const appear = ease((t - T.picker[0]) / 0.14);
    picker.style.opacity = appear;
    picker.style.transform = `scale(${(0.96 + 0.04 * appear).toFixed(3)})`;
    const typed = "acm".slice(0, T.type.filter(at => t >= at).length);
    const rows = FOLDERS.filter(f => f.toLowerCase().includes(typed)).slice(0, 7);
    const caret = Math.floor((t - T.picker[0]) / 0.5) % 2 === 0 || typed ? '<span class="caret"></span>' : "";
    picker.innerHTML = `
      <div class="title">Move to folder</div>
      <div class="field">${ICON.search}<span>${typed ? `${typed}${caret}` : `${caret}<span class="ph">Search folders</span>`}</span></div>
      <ul>${rows.map((f, i) => `<li class="${i === 0 ? "hl" : ""}">${f}</li>`).join("")}</ul>`;
  } else {
    picker.style.opacity = 0;
  }

  // Key caps for each shortcut.
  const key = document.getElementById("key");
  const shown = [[T.key1, "⌃S"], [T.ret, "↩"], [T.key2, "⌃⇧S"]].find(([span]) => within(t, span));
  if (shown) {
    const [[a, b], label] = shown;
    key.textContent = label;
    key.style.opacity = Math.min(ease((t - a) / 0.12), ease((b - t) / 0.15)).toFixed(3);
  } else {
    key.style.opacity = 0;
  }

  // Fade in at the start and out at the end, so the loop restarts smoothly.
  const fade = t < T.fadeIn[1] ? 1 - ease(t / T.fadeIn[1]) : ease((t - T.fadeOut[0]) / (T.fadeOut[1] - T.fadeOut[0]));
  document.getElementById("fade").style.opacity = fade.toFixed(3);
}
render(new URLSearchParams(location.search).has("t") ? +new URLSearchParams(location.search).get("t") : 0.5);
</script>
</body>
</html>
